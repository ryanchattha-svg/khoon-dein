<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Fridge Access - Khoon Dein</title>
    <style>
        :root { --primary: #b91c1c; --bg: #fef2f2; --text: #1f2937; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 480px; border-top: 5px solid var(--primary); }
        h1 { color: var(--primary); font-size: 1.5rem; margin-top: 0; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; }
        input, select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--primary); ring: 2px solid var(--primary); }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 0.875rem; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: background 0.2s; }
        button:hover { background: #991b1b; }
        #result { margin-top: 1.5rem; padding: 1rem; border-radius: 0.5rem; text-align: center; display: none; }
        .success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .code-display { font-size: 2.5rem; font-weight: 800; letter-spacing: 0.25rem; color: #065f46; margin: 0.5rem 0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Blood Fridge Access</h1>
        <div class="subtitle">Secure 2FA: Enter your registered details to generate a one-time code.</div>
        
        <form id="codeForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" required placeholder="Muhammad Ryan Chattha">
            </div>
            <div class="form-group">
                <label>CNIC (13 digits)</label>
                <input type="text" id="cnic" required placeholder="3840391406461" maxlength="13">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile" required placeholder="03285130730">
            </div>
            <div class="form-group">
                <label>Blood Group</label>
                <select id="bloodGroup" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                </select>
            </div>
            <button type="submit">Generate my code</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('result');
            resDiv.style.display = 'block';
            resDiv.className = '';
            resDiv.innerHTML = 'Generating secure code...';

            const payload = {
                name: document.getElementById('name').value.trim(),
                cnic: document.getElementById('cnic').value.trim(),
                mobile: document.getElementById('mobile').value.trim(),
                bloodGroup: document.getElementById('bloodGroup').value
            };

            try {
                const response = await fetch('/.netlify/functions/issue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    resDiv.className = 'success';
                    resDiv.innerHTML = `<div>Your one-time access code:</div><div class="code-display">${data.code}</div><div style="font-size: 0.8rem; color: #047857;">Valid for 10 minutes. Tap your card at the fridge and enter this code.</div>`;
                } else {
                    resDiv.className = 'error';
                    resDiv.innerHTML = data.error || 'Verification failed. Ensure your CNIC is registered by the admin.';
                }
            } catch (err) {
                resDiv.className = 'error';
                resDiv.innerHTML = 'Network error. Please try again.';
            }
        });
    </script>
</body>
</html>
