[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/card"
  to = "/.netlify/functions/card"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200
  force = true

[[redirects]]
  from = "/api/issue"
  to = "/.netlify/functions/issue"
  status = 200
  force = true

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
