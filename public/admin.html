<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title><link rel="stylesheet" href="style.css"></head><body>
<h1>🛠 Admin</h1><nav><a href="index.html">Access</a><a href="hospital.html">Hospitals</a></nav>
<section><input id="key" type="password" placeholder="DEVICE_KEY"><button class="sm" id="seed">Seed leads & demo stock</button> <span id="m0" class="msg"></span></section>
<section><h2>Register NFC card</h2><form id="f"><input name="uid" placeholder="Card UID (hex)" required>
<input name="name" placeholder="Full name" required><input name="cnic" placeholder="CNIC" inputmode="numeric" required>
<input name="mobile" placeholder="Mobile" required><select name="bloodGroup" class="bg"></select><button>Register</button></form><div id="m1" class="msg"></div></section>
<section><h2>Cards</h2><div class="wrap"><table id="cards"></table></div></section>
<section><h2>Deliveries</h2><div class="wrap"><table id="dl"></table></div></section>
<section><h2>Audit log</h2><div class="wrap"><table id="logs"></table></div></section>
<script src="app.js"></script><script>
async function load() {
  try {
    const c = await api("/api/register", {}, true);
    $("#cards").innerHTML = "<tr><th>Name</th><th>UID</th><th>BG</th><th></th></tr>" + c.cards.map((x) =>
      `<tr><td>${esc(x.name)}</td><td>${esc(x.uid)}</td><td>${esc(x.bloodGroup)}</td><td><button class="sm" onclick="del('${esc(x.uid)}')">✕</button></td></tr>`).join("");
    const d = await api("/api/deliveries", {}, true);
    $("#dl").innerHTML = "<tr><th>ID</th><th>Need</th><th>Address</th><th>Status</th></tr>" + d.deliveries.map((x) =>
      `<tr><td>${esc(x.id)}${x.urgent ? " 🚨" : ""}</td><td>${x.units}× ${esc(x.group)}</td><td>${esc(x.address)}<br>${esc(x.mobile)}</td>
      <td><select onchange="setSt('${esc(x.id)}',this.value)">${["requested","dispatched","in_transit","delivered","cancelled"].map((s) => `<option ${s === x.status ? "selected" : ""}>${s}</option>`).join("")}</select></td></tr>`).join("");
    const l = await api("/api/logs", {}, true);
    $("#logs").innerHTML = "<tr><th>Time</th><th>Event</th><th>Who</th></tr>" + l.logs.map((x) =>
      `<tr><td>${new Date(x.ts).toLocaleString()}</td><td>${esc(x.event)}</td><td>${esc(x.name || x.uid || x.id || "")}</td></tr>`).join("");
  } catch (e) { say($("#m0"), e.message, false); }
}
window.onKey = load;
async function del(uid) { if (confirm("Remove card " + uid + "?")) { await api("/api/register?uid=" + uid, { method: "DELETE" }, true); load(); } }
async function setSt(id, status) { await post("/api/deliveries", { action: "status", id, status }, true); }
$("#seed").onclick = async () => { try { await post("/api/seed", {}, true); say($("#m0"), "Seeded", true); load(); } catch (e) { say($("#m0"), e.message, false); } };
$("#f").addEventListener("submit", async (e) => { e.preventDefault();
  try { await post("/api/register", form("#f"), true); say($("#m1"), "Card registered", true); e.target.reset(); load(); } catch (er) { say($("#m1"), er.message, false); } });
</script></body></html>
